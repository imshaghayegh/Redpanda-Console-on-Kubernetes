apiVersion: kafka.strimzi.io/v1
kind: KafkaUser
metadata:
  name: redpanda-console
  namespace: kafka
  labels:
    strimzi.io/cluster: prod-kafka
spec:
  authentication:
    type: tls
  # Requires spec.kafka.authorization.type: simple in the Kafka CR.
  # Remove this authorization block if Kafka ACL authorization is disabled.
  authorization:
    type: simple
    acls:
      - resource:
          type: topic
          name: "*"
          patternType: literal
        operations:
          - Read
          - Describe
          - DescribeConfigs
      - resource:
          type: group
          name: "*"
          patternType: literal
        operations:
          - Read
          - Describe
      - resource:
          type: cluster
        operations:
          - Describe
