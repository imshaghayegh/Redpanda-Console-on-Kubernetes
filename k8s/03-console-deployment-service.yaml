apiVersion: apps/v1
kind: Deployment
metadata:
  name: redpanda-console
  namespace: kafka
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redpanda-console
  template:
    metadata:
      labels:
        app: redpanda-console
    spec:
      containers:
        - name: console
          # Replace with a VERIFIED path and tag from your private registry.
          image: registry.internal.example/redpandadata/console:v3.13.1
          imagePullPolicy: IfNotPresent
          env:
            - name: CONFIG_FILEPATH
              value: /etc/console/config.yaml
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 512Mi
          volumeMounts:
            - name: config
              mountPath: /etc/console/config.yaml
              subPath: config.yaml
              readOnly: true
            - name: certs
              mountPath: /etc/console/certs
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: redpanda-console-config
        - name: certs
          projected:
            sources:
              - secret:
                  name: prod-kafka-cluster-ca-cert
                  items:
                    - key: ca.crt
                      path: ca.crt
              - secret:
                  name: redpanda-console
                  items:
                    - key: user.crt
                      path: user.crt
                    - key: user.key
                      path: user.key
---
apiVersion: v1
kind: Service
metadata:
  name: redpanda-console
  namespace: kafka
spec:
  type: NodePort
  selector:
    app: redpanda-console
  ports:
    - name: http
      protocol: TCP
      port: 8080
      targetPort: 8080
      nodePort: 30080
